<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Background Vignette -->
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1a0f"/>
      <stop offset="70%" stop-color="#050a06"/>
      <stop offset="100%" stop-color="#020402"/>
    </radialGradient>

    <!-- Zombie Skin Gradient -->
    <linearGradient id="zombieSkin" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#7eb338"/>
      <stop offset="45%" stop-color="#558824"/>
      <stop offset="100%" stop-color="#2d5211"/>
    </linearGradient>

    <!-- Necrotic Shadow Gradient -->
    <linearGradient id="rotShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b330b"/>
      <stop offset="100%" stop-color="#0b1704"/>
    </linearGradient>

    <!-- Toxic Glow for Eyes -->
    <filter id="eyeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Blood / Infection Accent -->
    <linearGradient id="goreAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a141b"/>
      <stop offset="100%" stop-color="#4d0509"/>
    </linearGradient>
  </defs>

  <!-- Dark Tactical Hex/Badge Background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="#a3f52e" stroke-width="1.8" stroke-opacity="0.35"/>

  <!-- Subtle Biohazard Corner Marks -->
  <path d="M 6 14 L 6 6 L 14 6" stroke="#a3f52e" stroke-width="1.8" fill="none" opacity="0.6"/>
  <path d="M 50 6 L 58 6 L 58 14" stroke="#a3f52e" stroke-width="1.8" fill="none" opacity="0.6"/>
  <path d="M 6 50 L 6 58 L 14 58" stroke="#a3f52e" stroke-width="1.8" fill="none" opacity="0.6"/>
  <path d="M 50 58 L 58 58 L 58 50" stroke="#a3f52e" stroke-width="1.8" fill="none" opacity="0.6"/>

  <!-- Zombie Head Silhouette -->
  <!-- Cranium and Jaw -->
  <path d="M 32 10
           C 44 10, 52 17, 52 29
           C 52 35, 49 40, 46 43
           L 46 47
           C 46 51, 41 54, 32 54
           C 23 54, 18 51, 18 47
           L 18 43
           C 15 40, 12 35, 12 29
           C 12 17, 20 10, 32 10 Z"
        fill="url(#zombieSkin)"
        stroke="#1a330a"
        stroke-width="2"/>

  <!-- Cranium Crack / Exposed Rot Tissue (Top-Right) -->
  <path d="M 38 10 C 43 14, 46 17, 49 22 L 44 24 C 42 20, 39 16, 36 12 Z"
        fill="url(#goreAccent)"
        opacity="0.9"/>
  <path d="M 39 11 L 43 19 L 40 21 L 45 25"
        stroke="#d4ff4d"
        stroke-width="0.8"
        fill="none"
        opacity="0.75"/>

  <!-- Rot spots on temple -->
  <circle cx="20" cy="20" r="2" fill="#1d360c" opacity="0.8"/>
  <circle cx="17" cy="24" r="1.3" fill="#1d360c" opacity="0.8"/>

  <!-- Deep Sunken Eye Sockets -->
  <!-- Left Eye Socket -->
  <ellipse cx="24" cy="30" rx="5.5" ry="6.5" fill="#091405"/>
  <!-- Right Eye Socket -->
  <ellipse cx="40" cy="30" rx="5.5" ry="6.5" fill="#091405"/>

  <!-- Glowing Neon Radioactive Zombie Eyes -->
  <!-- Left Eye (Intense glowing biohazard pupil) -->
  <ellipse cx="24.5" cy="30" rx="3.2" ry="3.8" fill="#d4ff4d" filter="url(#eyeGlow)"/>
  <ellipse cx="25" cy="30" rx="1.2" ry="2.2" fill="#050e03"/>
  <circle cx="26" cy="29" r="0.8" fill="#ffffff"/>

  <!-- Right Eye (Slightly ruptured/frenzied) -->
  <ellipse cx="39.5" cy="30" rx="2.5" ry="2.8" fill="#a3f52e" filter="url(#eyeGlow)"/>
  <circle cx="39.8" cy="30" r="1" fill="#050e03"/>

  <!-- Decomposed Nose Cavity (Triangle) -->
  <path d="M 32 35 L 30 40 L 34 40 Z" fill="#070f04"/>

  <!-- Sunken Cheekbone Shadows -->
  <path d="M 14 36 C 18 37, 19 41, 18 45" stroke="#1d380c" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M 50 36 C 46 37, 45 41, 46 45" stroke="#1d380c" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- Gaping Decayed Mouth Cavity -->
  <path d="M 21 44 Q 32 46 43 44 Q 41 51 32 51 Q 23 51 21 44 Z" fill="#060c04"/>

  <!-- Sharp Jagged Decayed Teeth -->
  <!-- Upper Teeth -->
  <path d="M 23 44 L 24.5 47 L 26 44" fill="#e2dab8" stroke="#1a330a" stroke-width="0.5"/>
  <path d="M 27 44.5 L 28.5 47.5 L 30 44.5" fill="#e2dab8" stroke="#1a330a" stroke-width="0.5"/>
  <path d="M 34 44.5 L 35.5 47.5 L 37 44.5" fill="#e2dab8" stroke="#1a330a" stroke-width="0.5"/>
  <path d="M 38 44 L 39.5 47 L 41 44" fill="#e2dab8" stroke="#1a330a" stroke-width="0.5"/>

  <!-- Lower Teeth -->
  <path d="M 25 50 L 26.5 47 L 28 50" fill="#e2dab8" stroke="#1a330a" stroke-width="0.5"/>
  <path d="M 31 50.5 L 32.5 47.5 L 34 50.5" fill="#e2dab8" stroke="#1a330a" stroke-width="0.5"/>
  <path d="M 36 50 L 37.5 47 L 39 50" fill="#e2dab8" stroke="#1a330a" stroke-width="0.5"/>

  <!-- Toxic Slime / Ooze Drip from Jaw -->
  <path d="M 25 50 C 25 53, 27 55, 27 57 C 27 58, 26 58.5, 25.5 57 C 25 55.5, 24 53, 24 50 Z"
        fill="#a3f52e"
        opacity="0.95"
        filter="url(#eyeGlow)"/>

  <!-- Chin Stitches / Scar -->
  <line x1="30" y1="52" x2="35" y2="53" stroke="#122407" stroke-width="1.2"/>
  <line x1="31" y1="51.5" x2="31" y2="53.5" stroke="#122407" stroke-width="0.8"/>
  <line x1="33.5" y1="52" x2="33.5" y2="54" stroke="#122407" stroke-width="0.8"/>
</svg>
