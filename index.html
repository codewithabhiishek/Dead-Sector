<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>DEAD SECTOR — Zombie Survival</title>
    <!-- fonts load async so they can never block the preview from opening -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Creepster&family=Oxanium:wght@400;500;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Creepster&family=Oxanium:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Creepster&family=Oxanium:wght@400;500;600;700;800&display=swap"
      />
    </noscript>
    <style>
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #060a07;
        overflow: hidden;
      }
      .boot-msg {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #a3f52e;
        font-family: "Oxanium", ui-monospace, monospace;
        font-weight: 700;
        letter-spacing: 0.3em;
        font-size: 12px;
        text-transform: uppercase;
        animation: bootpulse 1.1s ease-in-out infinite;
      }
      @keyframes bootpulse {
        0%,
        100% {
          opacity: 0.35;
        }
        50% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-msg">Establishing uplink…</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
